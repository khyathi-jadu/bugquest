:root{--bg:#0b0d12;--panel:#121620;--raised:#181e2a;--line:#262d3b;--text:#f3f5fa;--muted:#929bb0;--purple:#8c72ff;--green:#00d9a6;--amber:#ffb547;--red:#ff5d73;--blue:#77a9ff;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px var(--sans);min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;background:#0e1118;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 27px;font:700 19px var(--display);letter-spacing:-.5px}.brandmark{width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,#9d84ff,#6448df);display:grid;place-items:center;box-shadow:0 5px 20px #765aff38}.brandmark svg{width:18px}.brand span{color:#a89aff}.nav-label{font:10px var(--mono);letter-spacing:1.2px;color:#697287;padding:16px 11px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px;color:var(--muted);display:flex;align-items:center;gap:11px;transition:.18s}.nav button:hover,.nav button.active{background:#1a1e2b;color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--purple)}.nav svg{width:17px;height:17px}.nav .count{margin-left:auto;font:10px var(--mono);color:#9b8cff}.side-bottom{margin-top:auto}.profile{margin-top:12px;border-top:1px solid var(--line);padding:16px 9px 0;display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;border-radius:50%;background:#302852;color:#c2b6ff;display:grid;place-items:center;font-weight:700}.profile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.main{min-width:0}.topbar{height:66px;border-bottom:1px solid var(--line);d card{transition:.2s;cursor:pointer;min-height:208px;display:flex;flex-direction:column}.case-card:hover{border-color:#59499c;transform:translateY(-2px)}.case-card h3{font:600 16px var(--display);margin:10px 0 7px}.case-card p{flex:1}.case-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px;margin-top:12px;color:var(--muted);font-size:10px}.workspace{padding:18px 22px;max-width:none}.work-head{margin-bottom:15px}.work-grid{display:grid;grid-template-columns:220px minmax(300px,1fr) 240px;gap:12px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel-head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font:600 11px var(--display)}.panel-body{padding:13px}.tiny{font-size:10px;color:var(--muted);line-height:1.55}.evidence-list{display:grid;gap:4px;margin-top:13px}.evidence-list button{border:0;background:transparent;text-align:left;padding:9px 7px;color:#bec5d1;font-size:11px;border-radius:6px}.evidence-list button:hover{background:#1e2431}.evidence-list button span{color:var(--purple);font:10px var(--mono);margin-right:8px}.brief{margin-bottom:12px}.brief h2{font:600 17px var(--display);margin:8px 0}.brief p{font-size:11px;color:var(--muted);line-height:1.6;margin:0}.brief-meta{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.editor{background:#0c0f15}.editor-top{height:38px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font:10px var(--mono);color:var(--muted)}.tab{color:var(--text);border-bottom:1px solid var(--purple);height:38px;display:flex;align-items:center}.code{width:100%;height:290px;resize:vertical;border:0;background:#0c0f15;color:#cbd4e2;padding:15px 17px;font:12px/1.65 var(--mono);outline:0;tab-size:4;white-space:pre;overflow:auto}.console{border-top:1px solid var(--line)}.console-head{padding:9px 12px;display:flex;justify-content:space-between;color:var(--muted);font:10px var(--mono)}.console-body{padding:0 13px 13px;font:10px/1.65 var(--mono);color:#b4bdca;min-height:70px;white-space:pre-wrap}.console-body .ok{color:var(--green)}.console-body .warn{color:var(--amber)}.work-actions{display:flex;gap:7px}.work-actions .btn{padding:8px 11px;font-size:10px}.note{width:100%;min-height:100px;resize:vertical;background:#10141c;border:1px solid var(--line);border-radius:6px;padding:9px;font:11px/1.5 var(--sans);outline:0}.hyp-form{display:flex;gap:6px;margin-top:9px}.hyp-form input{min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#10141c;font-size:10px;outline:0}.hyp-item{font-size:10px;padding:8px 0;border-bottom:1px solid var(--line);color:#c6cbd5;display:flex;gap:7px;align-items:flex-start}.hyp-item input{accent-color:var(--green);margin:1px 0 0}.hint{padding:9px;border:1px solid #3e3525;background:#201b12;border-radius:6px;color:#d6b875;font-size:10px;line-height:1.5;margin-top:8px}.modal-wrap{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:5;padding:20px}.modal{max-width:500px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 20px 80px #0009}.modal h2{font:600 20px var(--display);margin:6px 0 10px}.modal p{font-size:13px;line-height:1.7;color:#b4bdcc}.modal .close{float:right}.toast{position:fixed;bottom:22px;right:22px;background:#1c2630;border:1px solid #31564c;color:#8bf1cf;padding:12px 16px;border-radius:8px;z-index:8;font-size:12px;box-shadow:0 8px 35px #0008;animation:rise .2s ease}@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.empty{grid-column:1/-1;text-align:center;padding:42px;color:var(--muted)}.mobile-menu{display:none}.hide{display:none!important}.switch{font-size:10px;color:var(--muted)}@media(max-width:1050px){.work-grid{grid-template-columns:190px 1fr}.rightcol{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.case-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:4;left:-250px;width:238px;transition:.22s;box-shadow:10px 0 50px #0008}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 16px}.content{padding:25px 17px 40px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px;min-height:88px}.stat-value{font-size:22px}.layout2{grid-template-columns:1fr}.case-grid{grid-template-columns:1fr}.work-grid{grid-template-columns:1fr}.leftcol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.leftcol>.panel:first-child{grid-column:1/-1}.rightcol{grid-column:auto;grid-template-columns:1fr}.workspace{padding:14px}.work-head{align-items:flex-start}.heading{font-size:25px}.status{display:none}.code{height:240px}.filters .field{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body><div id="app"></div><div id="overlay"></div><script>
const cases=[
{id:'BQ-1042',title:'The Decimal Drift',desc:'A payment service quietly loses cents when customers split a bill. The ledger and receipt disagree.',difficulty:'Beginner',lang:'Python',category:'Data Handling',time:12,xp:120,tags:['precision','payments'],code:'def calculate_total(items):\n    total = 0\n    for item in items:\n        total += item["price"] * item["quantity"]\n    return round(total, 2)\n\n# A split payment should preserve every cent.\nprint(calculate_total([\n    {"price": 0.1, "quantity": 3},\n    {"price": 0.2, "quantity": 1}\n]))',brief:'PAYMENT SERVICE · INCIDENT BQ-1042',story:'Customers report that split payments sometimes differ by one cent from their receipt. The issue was first flagged by reconciliation at 09:42 UTC. Expected: exact decimal totals for every line item. Observed: binary floating-point drift can change the final cent. Find a reliable representation and return a rounded total.', tests:4, hints:['Inspect how Python represents decimal fractions such as 0.1.','Consider converting prices into integer cents before doing arithmetic.','Convert each item price to cents, multiply by quantity, sum cents, and divide by 100.'],fix:'Use integer cents for each line before summing. For production financial systems, use Decimal with explicit rounding rules.'},
{id:'BQ-1088',title:'The Vanishing Session',desc:'Users are logged out after refreshing the account page. The session check is suspiciously strict.',difficulty:'Beginner',lang:'Python',category:'Authentication Bugs',time:10,xp:100,tags:['auth','logic'],code:'def is_session_valid(session):\n    if not session:\n        return False\n    return session.get("expires_at", 0) > 0\n\nprint(is_session_valid({"expires_at": 1893456000}))',brief:'IDENTITY GATEWAY · INCIDENT BQ-1088',story:'A subset of active users are redirected to login after navigating between pages. The gateway considers expiration timestamps against a constant instead of the current time. Expected: accept sessions whose expiry is in the future. Observed: stale and future sessions are treated alike.',tests:3,hints:['Compare the expiry value with the current timestamp.','Inject or pass a current time to make the logic testable.'],fix:'Compare expires_at with current time, and treat missing or malformed expiry values as invalid.'},
{id:'BQ-1103',title:'The Silent Retry',desc:'A flaky upstream API returns duplicate records after a retry. A boundary in the retry loop may be off.',difficulty:'Intermediate',lang:'Python',category:'API Failures',time:18,xp:180,tags:['api','off-by-one'],code:'def retry_delays(max_retries):\n    delays = []\n    attempt = 0\n    while attempt <= max_retries:\n        delays.append(2 ** attempt)\n        attempt += 1\n    return delays\n\nprint(retry_delays(3))',brief:'EDGE API · INCIDENT BQ-1103',story:'During a brief upstream outage, a client issued one more request than its retry policy allowed. The issue surfaced in the request audit at 14:08 UTC. Expected: max_retries means retries after the initial attempt. Observed: the loop performs one extra retry and delay.',tests:4,hints:['Clarify whether max_retries counts the initial request.','The retry loop should produce max_retries delays, not max_retries + 1.'],fix:'Use a strict less-than boundary so the retry count matches the configured limit.'},
{id:'BQ-1130',title:'The Empty Cache',desc:'A cache hit containing an empty list is mistaken for a cache miss and triggers a database storm.',difficulty:'Intermediate',lang:'Python',category:'Performance Problems',time:16,xp:160,tags:['cache','state'],code:'def get_items(cache, key, database):\n    cached = cache.get(key)\n    if not cached:\n        cached = database.load(key)\n        cache[key] = cached\n    return cached\n\nprint(get_items({"items": []}, "items", None))',brief:'CATALOG CACHE · INCIDENT BQ-1130',story:'The catalog database load spiked after an empty category was cached. Empty results are valid, but the cache lookup treats them as absent. Expected: a cached empty result is a hit. Observed: every request queries the database again.',tests:3,hints:['Distinguish a missing key from a present key with a falsey value.','Check key membership instead of truthiness.'],fix:'Use key membership or a unique sentinel to distinguish an absent entry from cached empty data.'},
{id:'BQ-1177',title:'The Unchecked Payload',desc:'A malformed API response takes down a report page instead of showing a recoverable error.',difficulty:'Intermediate',lang:'Python',category:'Runtime Errors',time:20,xp:190,tags:['validation','api'],code:'def report_total(payload):\n    rows = payload["rows"]\n    return sum(row["amount"] for row in rows)\n\nprint(report_total({"rows": [{"amount": 10}, None]}))',brief:'REPORTING API · INCIDENT BQ-1177',story:'A partially malformed response from a legacy endpoint crashes the report page. The traceback points to an assumed nested field. Expected: validate data and surface a useful error. Observed: missing fields and invalid rows escape unchecked.',tests:4,hints:['Validate the shape of the payload before using nested values.','Decide how invalid rows should be handled and raise a clear exception.'],fix:'Validate payload and rows explicitly, then return a clear error or safely skip invalid rows according to product policy.'},
{id:'BQ-1201',title:'The Stale Counter',desc:'Two quick updates overwrite each other. The final count is lower than the number of events.',difficulty:'Advanced',lang:'Python',category:'Concurrency and State Management',time:25,xp:250,tags:['concurrency','state'],code:'def apply_events(counter, events):\n    current = counter.value\n    for event in events:\n        current = current + event\n    counter.value = current\n    return counter.value\n\n# Concurrent callers can read the same starting value.',brief:'EVENT PROCESSOR · INCIDENT BQ-1201',story:'A burst of simultaneous event updates produced a counter lower than the event log. Each worker reads and writes shared state without protecting the update. Expected: every event is applied exactly once. Observed: interleaving updates overwrite one another.',tests:4,hints:['Identify the read-modify-write sequence.','The update needs an atomic operation or a lock.'],fix:'Protect read-modify-write with a lock, or move aggregation to an atomic datastore operation.'},
{id:'BQ-1229',title:'The Open Redirect',desc:'A login return URL can send users to an untrusted domain after authentication.',difficulty:'Advanced',lang:'Python',category:'Security Vulnerabilities',time:22,xp:240,tags:['security','validation'],code:'from urllib.parse import urlparse\n\ndef safe_return_url(url):\n    parsed = urlparse(url)\n    return url if parsed.scheme in ("", "https") else "/"\n\nprint(safe_return_url("https://attacker.example/login"))',brief:'AUTH CALLBACK · INCIDENT BQ-1229',story:'Security review found an authentication callback that accepts any HTTPS destination. Users can be redirected to attacker-controlled sites after login. Expected: only trusted same-origin paths are accepted. Observed: protocol validation is mistaken for host validation.',tests:5,hints:['A safe scheme does not imply a trusted host.','Allow relative paths or compare against an explicit host allowlist.'],fix:'Accept same-origin relative paths and strictly allowlist trusted hosts; normalize before comparison.'},
{id:'BQ-1260',title:'The Missing Assertion',desc:'A refactor removed the only check that caught invalid records. The test suite still reports green.',difficulty:'Beginner',lang:'Python',category:'Testing Failures',time:11,xp:110,tags:['testing','quality'],code:'def normalize_user(user):\n    return {\n        "name": user.get("name", "").strip(),\n        "email": user.get("email", "").lower(),\n    }\n\n# Which invariant is no longer checked?',brief:'USER DIRECTORY · INCIDENT BQ-1260',story:'A refactor shipped even though blank names began entering the directory. The unit test only checks the happy path and lost its invalid-input assertion. Expected: required identity fields are validated. Observed: empty values pass through silently.',tests:3,hints:['Look for required fields that are normalized but never validated.','Add a test for a blank name and reject it clearly.'],fix:'Validate invariants before normalization, and add negative-path assertions to the suite.'}
];
const key='bugquest.v1';let state=JSON.parse(localStorage.getItem(key)||'{}');state.solved||=[];state.xp||=0;state.attempts||=0;state.activity||=[];state.notes||={};state.hyps||={};state.hints||={};state.code||={};state.streak||=0;state.theme||='dark';let current=null,filter={q:'',difficulty:'All difficulty',category:'All categories',status:'All cases'};
const icons={dash:'▦',cases:'◈',profile:'◎',settings:'⚙'};function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2400)}function solved(c){return state.solved.includes(c.id)}function stats(){let pct=state.attempts?Math.round(state.solved.length/state.attempts*100):0;return{level:Math.floor(state.xp/500)+1,pct}}
function shell(page,body){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="#dashboard"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7"><path d="M12 8v9M8 6l-2-2m10 2 2-2M6 10H3m18 0h-3M6 15H3m18 0h-3M8 19l-2 2m10-2 2 2"/><ellipse cx="12" cy="13" rx="4.5" ry="6"/><circle cx="12" cy="6" r="2"/></svg></span>bug<span>quest</span></a><div class="nav-label">INVESTIGATE</div><nav class="nav"><button class="${page==='dashboard'?'active':''}" onclick="go('dashboard')">▦ &nbsp; Dashboard</button><button class="${page==='cases'?'active':''}" onclick="go('cases')">◈ &nbsp; Case directory <span class="count">${cases.length}</span></button></nav><div class="nav-label">YOUR PROGRESS</div><nav class="nav"><button onclick="go('profile')">◎ &nbsp; Investigator profile</button></nav><div class="side-bottom"><div class="card" style="padding:13px;background:#151927"><div class="eyebrow">NEXT RANK</div><div style="font:600 13px var(--display);margin:7px 0">${state.xp} / ${stats().level*500} XP</div><div class="progress"><i style="width:${Math.min(100,state.xp/(stats().level*5))}%"></i></div></div><div class="profile"><div class="avatar">D</div><div><b style="font-size:12px">Detective</b><small>Level ${stats().level} investigator</small></div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="crumb">Workspace <span style="padding:0 7px;color:#525b6d">/</span> <b>${page==='work'?'Active investigation':page==='cases'?'Case directory':page==='profile'?'Investigator profile':'Dashboard'}</b></div></div><div class="top-actions"><span class="status"><i class="dot"></i> ALL SYSTEMS NOMINAL</span><button class="iconbtn" title="Toggle light theme" onclick="toggleTheme()">◐</button></div></header>${body}</main></div>`;applyTheme()}
function dashboard(){let {level,pct}=stats();shell('dashboard',`<div class="content"><div class="row"><div><div class="eyebrow">THURSDAY, OCTOBER 22 · INVESTIGATOR LOG</div><h1 class="heading">Good evening, Detective.</h1><p class="sub">The signal is noisy. The evidence is waiting.</p></div><button class="btn primary" onclick="go('cases')">＋ &nbsp;Browse open cases</button></div><div class="grid stats"><div class="card stat"><div class="stat-label">TOTAL EXPERIENCE <span style="color:var(--purple)">✳</span></div><div class="stat-value">${state.xp}<span class="stat-unit"> XP</span></div></div><div class="card stat"><div class="stat-label">CASES SOLVED <span style="color:var(--green)">✓</span></div><div class="stat-value">${state.solved.length}<span class="stat-unit"> / ${cases.length}</span></div></div><div class="card stat"><div class="stat-label">CURRENT STREAK <span style="color:var(--amber)">↗</span></div><div class="stat-value">${state.streak}<span class="stat-unit"> days</span></div></div><div class="card stat"><div class="stat-label">SUCCESS RATE <span style="color:var(--blue)">◌</span></div><div class="stat-value">${pct}<span class="stat-unit">%</span></div></div></div><div class="grid layout2"><section><div class="row section-head"><h2 class="section-title">Continue your investigation</h2><button class="btn ghost" onclick="go('cases')">All cases →</button></div><div class="card case-feature"><div class="case-id">${cases[0].id} &nbsp;·&nbsp; PAYMENT SYSTEMS</div><h3>${cases[0].title}</h3><p>${cases[0].desc}</p><span class="tag purple">Beginner</span><span class="tag">Python</span><span class="tag">~12 min</span><div style="margin-top:16px"><button class="btn primary" onclick="openCase('${cases[0].id}')">${solved(cases[0])?'Review case':'Resume case'} &nbsp; →</button></div><div class="progress"><i style="width:${solved(cases[0])?100:Math.min(85,(state.hints[cases[0].id]||0)*18+12)}%"></i></div><div class="barlabel"><span>${solved(cases[0])?'Case closed':'Investigation in progress'}</span><span>${solved(cases[0])?'100':'12'}%</span></div></div><div class="lower"><div class="row section-head"><h2 class="section-title">Recommended for you</h2><span class="tag green">STARTER CASES</span></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card case-card" onclick="openCase('${cases[1].id}')"><div class="case-id">${cases[1].id} · ${cases[1].difficulty.toUpperCase()}</div><h3>${cases[1].title}</h3><p>${cases[1].desc}</p><div class="case-foot"><span>Python · ${cases[1].time} min</span><span>✳ ${cases[1].xp} XP</span></div></div><div class="card case-card" onclick="openCase('${cases[7].id}')"><div class="case-id">${cases[7].id} · ${cases[7].difficulty.toUpperCase()}</div><h3>${cases[7].title}</h3><p>${cases[7].desc}</p><div class="case-foot"><span>Python · ${cases[7].time} min</span><span>✳ ${cases[7].xp} XP</span></div></div></div></div></section><section><div class="row section-head"><h2 class="section-title">Investigator record</h2><span class="tag purple">LEVEL ${level}</span></div><div class="card"><div class="section-head"><div class="stat-label">RANK PROGRESSION</div><div class="progress"><i style="width:${pct}%"></i></div><div class="barlabel"><span>Junior investigator</span><span>${state.xp} / ${level*500} XP</span></div></div><div class="section-head" style="margin-top:23px"><h3 class="section-title">Recent activity</h3></div>${state.activity.length?`<div class="activity">${state.activity.slice(0,4).map(a=>`<div class="activity-item"><div class="activity-icon">✓</div><div><strong>${esc(a.title)}</strong><small>${esc(a.when)} · +${a.xp} XP</small></div></div>`).join('')}</div>`:`<div class="activity-item"><div class="activity-icon">⌕</div><div><strong>Your story starts here</strong><small>Solve your first case to record activity.</small></div></div>`}</div><div class="card lower"><div class="row section-head"><h3 class="section-title">Skills under investigation</h3><span class="tiny">BASED ON CASES SOLVED</span></div><div class="skills">${[['Logic & control flow',state.solved.length?Math.min(100,22*state.solved.length):0],['Data handling',state.solved.some(x=>x==='BQ-1042')?70:0],['Reliability',state.solved.some(x=>x==='BQ-1177')?58:0]].map(([n,v])=>`<div class="skill-row"><span>${n}</span><div class="progress"><i style="width:${v}%;background:${v?'var(--green)':'#343b4c'}"></i></div><span>${v}%</span></div>`).join('')}</div></div></section></div><footer class="tiny" style="margin-top:32px">BUGQUEST — EVERY BUG HAS A STORY. &nbsp;·&nbsp; SIMULATED CASE DATA FOR DEMO PURPOSES</footer></div>`)}
function directory(){shell('cases',`<div class="content"><div class="eyebrow">INCIDENT RESPONSE ARCHIVE</div><div class="row"><div><h1 class="heading">Case directory</h1><p class="sub">Eight incidents. Each one has a story. Find the signal in the noise.</p></div><span class="tag">${state.solved.length} / ${cases.length} SOLVED</span></div><div class="filters"><input id="q" class="field" placeholder="⌕   Search incidents, tags, or IDs…" value="${esc(filter.q)}" oninput="filter.q=this.value;renderCases()"><select class="select" id="diff" onchange="filter.difficulty=this.value;renderCases()"><option>All difficulty</option>${['Beginner','Intermediate','Advanced'].map(x=>`<option ${filter.difficulty===x?'selected':''}>${x}</option>`)}</select><select class="select" id="cat" onchange="filter.category=this.value;renderCases()"><option>All categories</option>${[...new Set(cases.map(c=>c.category))].map(x=>`<option ${filter.category===x?'selected':''}>${x}</option>`)}</select><select class="select" id="status" onchange="filter.status=this.value;renderCases()">${['All cases','Unsolved','Solved'].map(x=>`<option ${filter.status===x?'selected':''}>${x}</option>`)}</select></div><div id="case-list" class="grid case-grid"></div></div>`);renderCases()}
function renderCases(){const host=document.getElementById('case-list');if(!host)return;let q=filter.q.toLowerCase();let a=cases.filter(c=>(!q||[c.id,c.title,c.desc,c.category,...c.tags].join(' ').toLowerCase().includes(q))&&(filter.difficulty==='All difficulty'||c.difficulty===filter.difficulty)&&(filter.category==='All categories'||c.category===filter.category)&&(filter.status==='All cases'||(filter.status==='Solved'?solved(c):!solved(c))));host.innerHTML=a.length?a.map(c=>`<article class="card case-card" onclick="openCase('${c.id}')"><div class="row"><span class="case-id">${c.id}</span><span class="tag ${solved(c)?'green':c.difficulty==='Advanced'?'amber':'purple'}">${solved(c)?'SOLVED':c.difficulty.toUpperCase()}</span></div><h3>${c.title}</h3><p>${c.desc}</p><div>${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="case-foot"><span>${c.lang} · ${c.time} min</span><span>✳ ${c.xp} XP</span></div></article>`).join(''):'<div class="card empty">No cases match these filters. Try widening your search.</div>'}
function openCase(id){current=cases.find(c=>c.id===id);if(!current)return;workspace()}
function workspace(){let c=current;let code=state.code[c.id]??c.code;let hint=state.hints[c.id]||0;shell('work',`<div class="content workspace"><div class="row work-head"><div><div class="eyebrow">${c.id} · ${c.category.toUpperCase()}</div><h1 class="heading" style="font-size:22px">${c.title}</h1></div><div class="work-actions"><button class="btn" onclick="go('cases')">← Cases</button><button class="btn" onclick="resetCode()">↺ Reset</button><button class="btn" onclick="copyCode()">▣ Copy</button></div></div><div class="work-grid"><div class="leftcol"><div class="panel"><div class="panel-head">INCIDENT BRIEFING <span style="color:var(--purple)">◈</span></div><div class="panel-body"><div class="tiny">${c.brief}</div><p class="tiny" style="margin-top:10px">${c.story}</p><div class="brief-meta"><span class="tag ${c.difficulty==='Advanced'?'amber':'purple'}">${c.difficulty}</span><span class="tag">${c.lang}</span><span class="tag">~${c.time} min</span></div></div></div><div class="panel"><div class="panel-head">EVIDENCE FILES <span class="tiny">3</span></div><div class="panel-body"><div class="evidence-list"><button onclick="evidence(0)"><span>01</span>system.log</button><button onclick="evidence(1)"><span>02</span>request_sample.json</button><button onclick="evidence(2)"><span>03</span>deployment.diff</button></div></div></div></div><div><div class="panel brief"><div class="panel-body"><div class="eyebrow">INVESTIGATION OBJECTIVE</div><h2>Reproduce. Reason. Repair.</h2><p>${c.desc} Inspect the evidence, write down a hypothesis, update the faulty code, then run the demo checks.</p></div></div><div class="panel editor"><div class="editor-top"><span class="tab">● &nbsp; solution.py</span><span id="dirty">${state.code[c.id]?'● Unsaved edits':'Saved starter'}</span><span>PYTHON 3 · DEMO MODE</span></div><textarea class="code" id="code" spellcheck="false" aria-label="Python solution editor" oninput="markDirty()">${esc(code)}</textarea><div class="console"><div class="console-head"><span>▸ &nbsp; DEMO TEST RUNNER</span><span class="tag amber">SIMULATED · NO CODE EXECUTION</span></div><div class="console-body" id="console">Ready when you are. Results are deterministic demo feedback and do not execute your code.</div></div><div class="editor-top" style="height:auto;padding:10px 12px;justify-content:flex-end;gap:7px"><button class="btn" onclick="runCase()">▶ &nbsp; Run checks</button><button class="btn primary" onclick="submitCase()">Submit fix &nbsp; →</button></div></div></div><div class="rightcol"><div class="panel"><div class="panel-head">INVESTIGATION NOTES <span id="savednote" class="tiny">Autosaved</span></div><div class="panel-body"><textarea class="note" placeholder="Record what the evidence suggests…" oninput="saveNote(this.value)">${esc(state.notes[c.id]||'')}</textarea></div></div><div class="panel"><div class="panel-head">WORKING HYPOTHESES <span class="tiny">${(state.hyps[c.id]||[]).length}</span></div><div class="panel-body"><div id="hyps">${hypList()}</div><div class="hyp-form"><input id="hyp-input" placeholder="I suspect…" onkeydown="if(event.key==='Enter')addHyp()"><button class="btn" style="padding:6px 9px" onclick="addHyp()">＋</button></div></div></div><div class="panel"><div class="panel-head">HINT PROGRESSION <span class="tiny">${hint} / ${c.hints.length}</span></div><div class="panel-body"><div class="tiny">Hints reduce the mystery. Use them when you need a nudge.</div>${hint?`<div class="hint">HINT ${hint}: ${c.hints[hint-1]}</div>`:''}<button class="btn" style="width:100%;margin-top:9px" onclick="revealHint()">⌁ &nbsp; Reveal next hint</button><div class="tiny" style="margin-top:9px">CASE REWARD <b style="color:var(--amber)">✳ ${c.xp} XP</b></div></div></div></div></div></div>`)}
function hypList(){let a=state.hyps[current.id]||[];return a.length?a.map((h,i)=>`<div class="hyp-item"><input type="checkbox" ${h.done?'checked':''} onchange="toggleHyp(${i})"><span>${esc(h.text)}</span><button class="iconbtn" style="margin-left:auto;width:25px;height:23px" title="Delete hypothesis" onclick="deleteHyp(${i})">×</button></div>`).join(''):'<div class="tiny">No hypotheses yet. What might explain the symptoms?</div>'}
function addHyp(){let el=document.getElementById('hyp-input');if(!el||!el.value.trim())return;state.hyps[current.id]||=[];state.hyps[current.id].push({text:el.value.trim(),done:false});save();workspace()}
function toggleHyp(i){state.hyps[current.id][i].done=!state.hyps[current.id][i].done;save();document.getElementById('hyps').innerHTML=hypList()}
function deleteHyp(i){state.hyps[current.id].splice(i,1);save();document.getElementById('hyps').innerHTML=hypList()}
function saveNote(v){state.notes[current.id]=v;save();let n=document.getElementById('savednote');n.textContent='Saving…';setTimeout(()=>{if(n)n.textContent='Autosaved'},350)}
function markDirty(){document.getElementById('dirty').textContent='● Unsaved edits';state.code[current.id]=document.getElementById('code').value;save()}
function resetCode(){state.code[current.id]=current.code;save();workspace();toast('Starter code restored.')}
function copyCode(){navigator.clipboard?.writeText(document.getElementById('code').value).then(()=>toast('Code copied to clipboard.')).catch(()=>toast('Select and copy the code manually.'))}
function revealHint(){let c=current,n=state.hints[c.id]||0;if(n>=c.hints.length){toast('You have uncovered every hint.');return}state.hints[c.id]=n+1;save();workspace()}
function runCase(){let c=current;let out=document.getElementById('console');out.innerHTML='<span class="warn">[DEMO] Running deterministic scenario…</span>';setTimeout(()=>{if(!document.getElementById('console'))return;out.innerHTML=`<span class="warn">[SIMULATED RESULTS — your code was not executed]</span>\nCase: ${c.id} · scenario checks: ${c.tests}\n<span class="ok">✓ 1 visible scenario reviewed</span>\n<span class="warn">? Hidden checks unavailable in demo mode</span>\n\nUse Submit fix to record a learning completion. This demo cannot verify your code.`},450)}
function submitCase(){let c=current;if(solved(c)){toast('This case is already in your solved record.');return}state.solved.push(c.id);state.xp+=c.xp;state.attempts++;state.streak=state.activity.length?Math.max(1,state.streak):1;state.activity.unshift({title:`Solved ${c.id} · ${c.title}`,when:'Just now',xp:c.xp});save();document.getElementById('console').innerHTML=`<span class="warn">[DEMO COMPLETION — solution was not executed or verified]</span>\nCase marked complete for learning progress.\n+${c.xp} XP · ${c.title}\n\n${c.fix}`;toast(`Case recorded · +${c.xp} XP`);setTimeout(()=>workspace(),1600)}
function evidence(i){let c=current,items=[['system.log',`09:42:16 WARN reconciliation: observed total differs from ledger\n09:42:16 INFO request_id=pay_8f2a amount_batch=3\n09:42:17 WARN delta=0.0000000000000001\n\nSignal: the discrepancy is tiny and repeatable. Consider how numeric representation can affect totals.`],['request_sample.json',`{\n  "items": [\n    {"price": 0.1, "quantity": 3},\n    {"price": 0.2, "quantity": 1}\n  ],\n  "expected_total": 0.5\n}\n\nSignal: individually valid values can behave unexpectedly when combined.`],['deployment.diff',`- total += item["price"] * item["quantity"]\n+ total += item["price"] * item["quantity"]\n+ # normalize at the end\n+ return round(total, 2)\n\nSignal: rounding was added after a customer report. Does it address the source of error?`]];if(c.id!=='BQ-1042')items[0]=['system.log',`${c.brief}\nWARN recurring incident signature detected\nINFO sample trace archived for review\n\nThis evidence points to the reported failure mode. Compare it with the code and expected behavior.`];showModal(items[i][0],items[i][1])}
function showModal(title,body){document.getElementById('overlay').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="iconbtn close" onclick="closeModal()">×</button><div class="eyebrow">EVIDENCE DETAIL</div><h2>${esc(title)}</h2><p style="white-space:pre-wrap;font:11px/1.7 var(--mono);background:#0e1118;border:1px solid var(--line);padding:15px;border-radius:7px;color:#c0cada">${esc(body)}</p><button class="btn" onclick="closeModal()">Close evidence</button></div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}
function profile(){shell('profile',`<div class="content"><div class="eyebrow">FIELD RECORD · LOCAL PROFILE</div><h1 class="heading">Investigator profile</h1><p class="sub">Progress is stored locally in this browser. No account is required.</p><div class="grid stats"><div class="card stat"><div class="stat-label">RANK</div><div class="stat-value">Level ${stats().level}</div></div><div class="card stat"><div class="stat-label">EXPERIENCE</div><div class="stat-value">${state.xp}<span class="stat-unit"> XP</span></div></div><div class="card stat"><div class="stat-label">SOLVED</div><div class="stat-value">${state.solved.length}<span class="stat-unit"> cases</span></div></div><div class="card stat"><div class="stat-label">ACHIEVEMENTS</div><div class="stat-value">${state.solved.length?Math.min(3,Math.ceil(state.solved.length/2)):0}<span class="stat-unit"> / 3</span></div></div></div><div class="grid layout2"><div class="card"><h2 class="section-title">Case record</h2><div class="activity" style="margin-top:16px">${state.solved.length?state.solved.map(id=>{let c=cases.find(x=>x.id===id);return `<div class="activity-item"><div class="activity-icon">✓</div><div><strong>${c.title}</strong><small>${id} · +${c.xp} XP</small></div></div>`}).join(''):'<div class="tiny">No cases solved yet. Your first incident is waiting in the directory.</div>'}</div></div><div class="card"><h2 class="section-title">Achievements</h2><div class="activity" style="margin-top:16px"><div class="activity-item"><div class="activity-icon">${state.solved.length?'✓':'⌕'}</div><div><strong>First Responder</strong><small>${state.solved.length?'Unlocked · solved a first case':'Solve your first case'}</small></div></div><div class="activity-item"><div class="activity-icon">${state.solved.length>=3?'✓':'◇'}</div><div><strong>Pattern Finder</strong><small>${state.solved.length>=3?'Unlocked · solved three cases':'Solve three cases'}</small></div></div><div class="activity-item"><div class="activity-icon">${state.solved.length===cases.length?'✓':'⌑'}</div><div><strong>Case Closed</strong><small>${state.solved.length===cases.length?'Unlocked · all starter cases solved':'Solve all starter cases'}</small></div></div></div><button class="btn" style="margin-top:20px" onclick="if(confirm('Clear all local BugQuest progress? This cannot be undone.')){localStorage.removeItem('bugquest.v1');location.reload()}">Reset local progress</button></div></div></div>`)}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';save();applyTheme()}function applyTheme(){document.body.classList.toggle('light',state.theme==='light');let style=document.getElementById('theme-style');if(!style){style=document.createElement('style');style.id='theme-style';document.head.appendChild(style)}style.textContent=state.theme==='light'?`:root{--bg:#f3f5fa;--panel:#fff;--raised:#f2f4f8;--line:#dde2ec;--text:#202433;--muted:#687186}.sidebar,.topbar{background:#fff}.case-feature{background:linear-gradient(110deg,#f4f0ff,#eef4fa)}.editor,.code{background:#f7f8fb;color:#293144}.note,.hyp-form input{background:#f7f8fb}.nav button.active,.nav button:hover{background:#f0eff8}.brandmark{box-shadow:none}.case-feature:after{color:#00000008}`:''}
function go(page){if(page==='cases')directory();else if(page==='profile')profile();else dashboard();history.replaceState(null,'','#'+page)}window.addEventListener('hashchange',()=>route());function route(){let h=location.hash.slice(1);if(h.startsWith('case/'))openCase(h.slice(5));else if(h==='cases')directory();else if(h==='profile')profile();else dashboard()}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&current)runCase()});route();
</script></body></html>
